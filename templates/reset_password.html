<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Campus Retain AI</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">



    <style>

        body {

            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

            background-color: #f8fafc;

            color: #0f172a;

        }



        .ambient-mesh {

            background:

                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),

                radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),

                radial-gradient(at 50% 100%, rgba(224, 231, 255, 0.5) 0px, transparent 50%);

        }



        .glass-card {

            background: rgba(255, 255, 255, 0.9);

            backdrop-filter: blur(20px);

            -webkit-backdrop-filter: blur(20px);

            border: 1px solid rgba(226, 232, 240, 0.9);

        }



        .hover-card {

            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);

        }

        .hover-card:hover {

            transform: translateY(-2px);

            box-shadow: 0 25px 50px -12px rgba(79, 70, 229, 0.15);

        }

    </style>

</head>

<body class="ambient-mesh min-h-screen flex items-center justify-center p-4 sm:p-6 relative">



    <div class="w-full max-w-md glass-card rounded-3xl shadow-xl overflow-hidden hover-card">



        <div class="p-8 pb-7 bg-gradient-to-br from-indigo-900 via-indigo-950 to-slate-900 text-center text-white relative overflow-hidden">

            <div class="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-inner text-xl">🔒</div>

            <h1 class="text-2xl font-black tracking-tight">Reset Password</h1>

            <p class="text-indigo-200 text-xs font-semibold uppercase tracking-widest mt-1">Verification Console</p>

        </div>



        <div class="p-8">

            {% if message %}

            <div class="bg-indigo-50 border border-indigo-200 text-indigo-700 p-4 rounded-2xl mb-5 text-xs font-semibold flex items-start gap-2.5">

                <span class="text-sm">📧</span>

                <span>{{ message }} <strong>{{ email }}</strong></span>

            </div>

            {% endif %}



            {% if error %}

            <div class="bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-2xl mb-5 text-xs font-semibold flex items-center gap-2.5">

                <span class="shrink-0 text-sm">❌</span>

                <span>{{ error }}</span>

            </div>

            {% endif %}



            <form action="/reset-password" method="POST" class="space-y-4">

                <div>

                    <label class="block text-xs font-bold text-slate-600 mb-1.5">Enter 6-Digit Verification Code</label>

                    <input type="text" name="otp" placeholder="123456" maxlength="6" pattern="\d{6}" required autocomplete="off"

                           class="w-full border border-slate-200 p-3.5 rounded-xl bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-center tracking-[0.5em] text-lg font-bold text-slate-800">

                </div>



                <div>

                    <label class="block text-xs font-bold text-slate-600 mb-1.5">New Password</label>

                    <input type="password" name="new_password" placeholder="••••••••" minlength="4" required

                           class="w-full border border-slate-200 p-3.5 rounded-xl bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-sm font-medium text-slate-800">

                </div>



                <button type="submit"

                        class="w-full py-3.5 mt-2 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white rounded-xl font-bold transition shadow-md shadow-indigo-500/20 flex justify-center items-center gap-2 text-sm tracking-wide">

                    <span>Update Password & Sign In</span>

                </button>

            </form>



            <div class="mt-6 text-center">

                <a href="/login" class="text-xs font-bold text-slate-400 hover:text-indigo-600 transition">

                    ← Return to Sign-in

                </a>

            </div>

        </div>

    </div>



</body>

</html>
