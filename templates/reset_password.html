<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Campus Retain</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes meshGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .vibrant-bg {
            background: linear-gradient(-45deg, #eef2ff, #f5f3ff, #f9b4ed, #f0fdf4);
            background-size: 300% 300%;
            animation: meshGradient 12s ease infinite;
        }
    </style>
</head>
<body class="vibrant-bg h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-md bg-white/90 backdrop-blur-xl rounded-[2.5rem] shadow-[0_30px_70px_rgba(109,40,217,0.12)] overflow-hidden border border-white/60 transform transition-all duration-500 animate__animated animate__zoomIn animate__fast">
        
        <div class="p-9 pb-8 bg-gradient-to-br from-violet-600 via-indigo-600 to-purple-700 text-center text-white relative overflow-hidden">
            <div class="absolute -top-6 -right-6 w-36 h-36 bg-amber-400 rounded-full opacity-20 blur-xl"></div>
            <div class="absolute -bottom-10 -left-6 w-36 h-36 bg-fuchsia-400 rounded-full opacity-30 blur-2xl"></div>
            
            <div class="w-14 h-14 bg-white/10 rounded-2xl flex items-center justify-center text-white font-bold text-2xl mx-auto mb-3 shadow-inner">🔒</div>
            <h1 class="text-2xl font-extrabold tracking-tight relative z-10">Reset Your Password</h1>
            <p class="text-indigo-100/90 text-xs font-semibold uppercase tracking-widest mt-1.5 relative z-10">Verification Console</p>
        </div>
        
        <div class="p-9">
            {% if message %}
            <div class="bg-indigo-50 border border-indigo-100 text-indigo-600 p-4 rounded-2xl mb-6 text-xs font-semibold flex items-start gap-2.5">
                <span class="text-sm">📧</span>
                <span>{{ message }} <strong>{{ email }}</strong></span>
            </div>
            {% endif %}

            {% if error %}
            <div class="bg-rose-50 border border-rose-100 text-rose-600 px-4 py-3.5 rounded-2xl mb-6 text-sm font-semibold flex items-center gap-3 animate__animated animate__shakeX">
                <span>❌ {{ error }}</span>
            </div>
            {% endif %}

            <form action="/reset-password" method="POST" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Enter 6-Digit OTP</label>
                    <input type="text" name="otp" placeholder="123456" maxlength="6" pattern="\d{6}" required autocomplete="off"
                           class="w-full border border-slate-200/80 p-3.5 rounded-xl bg-slate-50/50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition-all duration-300 text-center tracking-[0.5em] text-lg font-bold text-slate-800 shadow-inner">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Define New Password</label>
                    <input type="password" name="new_password" placeholder="••••••••" minlength="4" required 
                           class="w-full border border-slate-200/80 p-3.5 rounded-xl bg-slate-50/50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition-all duration-300 text-slate-700 font-medium shadow-inner">
                </div>
                
                <button type="submit" 
                        class="w-full py-4 mt-4 bg-slate-950 text-white rounded-xl font-bold transition-all duration-300 shadow-[0_10px_25px_rgba(15,23,42,0.2)] hover:bg-violet-600 hover:shadow-[0_12px_30px_rgba(109,40,217,0.3)] flex justify-center items-center transform active:scale-[0.98] text-sm tracking-wide group">
                    <span>Reconstruct Security Credentials</span>
                </button>
            </form>
            
            <div class="mt-6 text-center">
                <a href="/login" class="text-xs font-bold tracking-wide uppercase text-slate-400 hover:text-violet-600 transition duration-300">
                    ← Abandon and Return to Sign-in
                </a>
            </div>
        </div>
    </div>

</body>
</html>
