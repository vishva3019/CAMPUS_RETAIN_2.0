<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Portal Sign In | Campus Retain AI</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">



    <style>

        body {

            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

            background-color: #f8fafc;

            color: #0f172a;

        }



        .ambient-mesh {

            background:

                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),

                radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),

                radial-gradient(at 50% 100%, rgba(224, 231, 255, 0.5) 0px, transparent 50%);

        }



        .glass-card {

            background: rgba(255, 255, 255, 0.9);

            backdrop-filter: blur(20px);

            -webkit-backdrop-filter: blur(20px);

            border: 1px solid rgba(226, 232, 240, 0.9);

        }



        .hover-card {

            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);

        }

        .hover-card:hover {

            transform: translateY(-2px);

            box-shadow: 0 25px 50px -12px rgba(79, 70, 229, 0.15);

        }



        @media (prefers-reduced-motion: reduce) {

            .hover-card:hover { transform: none !important; }

            * { transition-duration: 0.01ms !important; }

        }

    </style>

</head>

<body class="ambient-mesh min-h-screen flex flex-col justify-between p-4 sm:p-6 relative">



    <!-- Decorative background grid -->

    <div class="absolute inset-0 bg-[linear-gradient(to_right,#80808008_1px,transparent_1px),linear-gradient(to_bottom,#80808008_1px,transparent_1px)] bg-[size:24px_24px] pointer-events-none"></div>



    <!-- Top Navigation Mini-Bar -->

    <div class="w-full max-w-6xl mx-auto flex items-center justify-between relative z-10 py-2">

        <a href="/" class="flex items-center gap-2.5 group">

            <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-500/20 group-hover:scale-105 transition">

                <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">

                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>

                </svg>

            </div>

            <span class="font-extrabold text-slate-900 text-sm tracking-tight">Campus<span class="text-indigo-600">Retain</span></span>

        </a>

        <a href="/" class="text-xs font-bold text-slate-500 hover:text-indigo-600 transition flex items-center gap-1">

            <span>← Back to Homepage</span>

        </a>

    </div>



    <!-- Central Authentication Unit -->

    <div class="flex-grow flex items-center justify-center w-full relative z-10 py-8">

        <div class="w-full max-w-md glass-card rounded-3xl shadow-xl overflow-hidden hover-card">



            <!-- Auth Header -->

            <div class="p-8 pb-7 bg-gradient-to-br from-indigo-900 via-indigo-950 to-slate-900 text-center text-white relative overflow-hidden">

                <div class="w-12 h-12 bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-inner">

                    <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>

                    </svg>

                </div>

                <h1 id="headerTitle" class="text-2xl font-black tracking-tight text-white">Campus Retain</h1>

                <p id="headerSubtitle" class="text-indigo-200 text-xs font-semibold uppercase tracking-widest mt-1">Student Portal Access</p>

            </div>



            <!-- Auth Form Body -->

            <div class="p-8">

                {% if error %}

                <div class="bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-2xl mb-5 text-xs font-semibold flex items-center gap-2.5">

                    <span class="shrink-0 text-sm">❌</span>

                    <span>{{ error }}</span>

                </div>

                {% endif %}



                {% if success %}

                <div class="bg-emerald-50 border border-emerald-200 text-emerald-700 px-4 py-3 rounded-2xl mb-5 text-xs font-semibold flex items-center gap-2.5">

                    <span class="shrink-0 text-sm">✓</span>

                    <span>{{ success }}</span>

                </div>

                {% endif %}



                <form id="authForm" action="/login" method="POST" class="space-y-4">

                    <div>

                        <label class="block text-xs font-bold text-slate-600 mb-1.5">University Email</label>

                        <input type="email" id="loginEmail" name="email" placeholder="student@ced.alliance.edu.in" required

                               class="w-full border border-slate-200 p-3.5 rounded-xl bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-sm font-medium text-slate-800 placeholder:text-slate-400">

                    </div>



                    <div id="passwordFieldContainer" class="relative">

                        <div class="flex justify-between items-center mb-1.5">

                            <label class="block text-xs font-bold text-slate-600">Password</label>

                            <button type="button" onclick="switchToForgotMode()" class="text-xs font-bold text-indigo-600 hover:text-indigo-700 focus:outline-none transition">Forgot?</button>

                        </div>

                        <input type="password" id="loginPassword" name="password" placeholder="••••••••" required

                               class="w-full border border-slate-200 p-3.5 rounded-xl bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-sm font-medium text-slate-800 placeholder:text-slate-400">

                    </div>



                    <button type="submit" id="submitBtn"

                            class="w-full py-3.5 mt-4 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white rounded-xl font-bold transition shadow-md shadow-indigo-500/20 flex justify-center items-center gap-2 text-sm tracking-wide">

                        <span id="btnText">Sign In or Register</span>

                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>

                    </button>

                </form>



                <div class="mt-6 pt-5 border-t border-slate-100 text-center">

                    <a href="/admin_login" class="text-xs font-bold text-slate-400 hover:text-indigo-600 transition">

                        Administrative Terminal Access →

                    </a>

                </div>

            </div>

        </div>

    </div>



    <!-- Footer Integration -->

    <footer class="w-full py-4 text-center px-4 relative z-10">

        <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3 text-xs font-medium text-slate-500">

            <div class="flex items-center gap-1.5 justify-center md:justify-start">

                <span>&copy; 2026</span>

                <span class="font-bold text-slate-800">Campus Retain</span>

                <span class="text-slate-300">|</span>

                <span>Alliance University</span>

            </div>



            <div class="flex gap-4 items-center justify-center text-slate-400 font-semibold">

                <button type="button" onclick="openLegalModal('privacy')" class="hover:text-indigo-600 transition">Privacy Policy</button>

                <button type="button" onclick="openLegalModal('terms')" class="hover:text-indigo-600 transition">Terms</button>

                <button type="button" onclick="openLegalModal('support')" class="hover:text-indigo-600 transition">DOSS Desk</button>

            </div>

        </div>

    </footer>



    <!-- LEGAL MODAL -->

    <div id="legalModal" class="hidden fixed inset-0 z-[100] flex items-center justify-center px-4 bg-slate-950/40 backdrop-blur-sm transition-all duration-300">

        <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden border border-slate-100 flex flex-col max-h-[80vh]">

            <div class="p-5 bg-indigo-600 text-white flex justify-between items-center shrink-0">

                <h3 id="modalTitle" class="text-base font-bold tracking-tight">Document View</h3>

                <button type="button" onclick="closeLegalModal()" class="text-white/80 hover:text-white p-1 rounded-lg">

                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>

                </button>

            </div>

            <div id="modalContent" class="p-6 overflow-y-auto text-xs text-slate-600 space-y-3 font-medium leading-relaxed"></div>

            <div class="p-4 bg-slate-50 border-t border-slate-100 flex justify-end shrink-0">

                <button type="button" onclick="closeLegalModal()" class="px-4 py-2 bg-slate-900 text-white text-xs font-bold rounded-xl">Acknowledge</button>

            </div>

        </div>

    </div>



    <script>

        const legalContent = {

            privacy: {

                title: "Privacy Policy",

                html: `<p>Campus Retain operates exclusively within Alliance University. We record student emails and verification descriptions strictly for asset return authentication. Secret item details are never exposed to the public or search engines.</p>`

            },

            terms: {

                title: "Terms of Service",

                html: `<p>All users must provide truthful verification details. Falsifying lost or found reports is strictly subject to university disciplinary guidelines. Physical item transfers occur exclusively through the Department of Student Services (DOSS) counter.</p>`

            },

            support: {

                title: "DOSS Support Counter",

                html: `<p><strong>Location:</strong> Department of Student Services (DOSS), Central Admin Wing<br><strong>Working Hours:</strong> 9:00 AM – 5:00 PM (Monday–Friday)<br><strong>Email:</strong> support@campusretain.in</p>`

            }

        };



        function openLegalModal(documentKey) {

            const data = legalContent[documentKey];

            if (!data) return;

            document.getElementById('modalTitle').innerText = data.title;

            document.getElementById('modalContent').innerHTML = data.html;

            document.getElementById('legalModal').classList.remove('hidden');

        }



        function closeLegalModal() {

            document.getElementById('legalModal').classList.add('hidden');

        }



        function switchToForgotMode() {

            const form = document.getElementById('authForm');

            const passwordContainer = document.getElementById('passwordFieldContainer');

            const btnText = document.getElementById('btnText');

            const headerTitle = document.getElementById('headerTitle');

            const headerSubtitle = document.getElementById('headerSubtitle');



            form.action = "/forgot-password";

            passwordContainer.style.display = "none";

            document.getElementById('loginPassword').required = false;



            headerTitle.innerText = "Password Recovery";

            headerSubtitle.innerText = "Request Verification Code";

            btnText.innerText = "Send Verification OTP";



            if (!document.getElementById('backToLoginBtn')) {

                const returnLink = document.createElement('button');

                returnLink.type = "button";

                returnLink.id = "backToLoginBtn";

                returnLink.className = "w-full text-center text-xs font-bold text-slate-400 hover:text-slate-600 mt-4 transition block";

                returnLink.innerText = "← Cancel and Return to Login";

                returnLink.onclick = () => location.reload();

                form.appendChild(returnLink);

            }

        }

    </script>

</body>

</html>
