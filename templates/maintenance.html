<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scheduled Maintenance | Campus Retain AI</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">



    <style>

        body {

            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

            background-color: #f8fafc;

            color: #0f172a;

        }



        .ambient-mesh {

            background:

                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),

                radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),

                radial-gradient(at 50% 100%, rgba(224, 231, 255, 0.5) 0px, transparent 50%);

        }



        .glass-card {

            background: rgba(255, 255, 255, 0.9);

            backdrop-filter: blur(20px);

            -webkit-backdrop-filter: blur(20px);

            border: 1px solid rgba(226, 232, 240, 0.9);

        }

    </style>

</head>

<body class="ambient-mesh min-h-screen flex items-center justify-center p-4 sm:p-6 relative">



    <div class="w-full max-w-lg glass-card rounded-3xl shadow-xl p-8 sm:p-10 text-center relative overflow-hidden space-y-6">



        <div class="w-20 h-20 bg-gradient-to-br from-indigo-600 to-violet-600 rounded-3xl flex items-center justify-center mx-auto shadow-lg shadow-indigo-500/30">

            <svg class="w-10 h-10 text-white animate-spin [animation-duration:8s]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">

                <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />

                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />

            </svg>

        </div>



        <div class="space-y-2">

            <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-slate-900">

                System <span class="bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">Optimization</span> In Progress

            </h1>

            <p class="text-xs sm:text-sm text-slate-500 font-medium max-w-sm mx-auto leading-relaxed">

                Campus Retain infrastructure is undergoing scheduled performance tuning and upgrades. Services will be restored momentarily.

            </p>

        </div>



        <div class="pt-4 border-t border-slate-100 flex items-center justify-center gap-2 text-xs font-bold text-slate-400 uppercase tracking-wider">

            <span class="flex h-2 w-2 relative">

                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>

                <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>

            </span>

            <span>Alliance University DOSS Network</span>

        </div>

    </div>

</html>
