<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheduled Maintenance | CampusRetain</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes meshGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .vibrant-bg {
            background: linear-gradient(-45deg, #eef2ff, #f5f3ff, #fdf2f8, #f0fdf4);
            background-size: 400% 400%;
            animation: meshGradient 12s ease infinite;
        }
    </style>
</head>
<body class="vibrant-bg h-screen flex items-center justify-center p-6 overflow-hidden">

    <div class="w-full max-w-xl bg-white/90 backdrop-blur-xl rounded-[2.5rem] shadow-[0_30px_70px_rgba(109,40,217,0.12)] p-10 border border-white/60 text-center relative overflow-hidden transform transition-all duration-500 animate__animated animate__zoomIn">
        
        <div class="absolute -top-10 -right-10 w-40 h-40 bg-amber-400 rounded-full opacity-10 blur-2xl"></div>
        <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-violet-500 rounded-full opacity-15 blur-2xl"></div>

        <div class="w-24 h-24 bg-gradient-to-br from-violet-600 to-indigo-600 rounded-3xl flex items-center justify-center mx-auto mb-8 shadow-[0_10px_30px_rgba(109,40,217,0.3)] animate__animated animate__pulse animate__infinite animate__slower">
            <svg class="w-12 h-12 text-white animate-spin [animation-duration:8s]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        </div>

        <h1 class="text-3xl md:text-4xl font-black tracking-tight text-slate-900 leading-tight">
            System <span class="bg-gradient-to-r from-violet-600 to-indigo-600 bg-clip-text text-transparent">Upgrades</span> In Progress
        </h1>
        
        <p class="mt-4 text-slate-500 font-medium text-sm md:text-base max-w-md mx-auto leading-relaxed">
            We are optimizing infrastructure elements and deploying features to improve your lost & found discoverability pipeline.
        </p>

        <div class="mt-8 flex items-center justify-center space-x-2">
            <div class="w-3 h-3 bg-violet-600 rounded-full animate-bounce [animation-delay:-0.3s]"></div>
            <div class="w-3 h-3 bg-indigo-500 rounded-full animate-bounce [animation-delay:-0.15s]"></div>
            <div class="w-3 h-3 bg-purple-400 rounded-full animate-bounce"></div>
        </div>

        <div class="mt-10 pt-6 border-t border-slate-100 flex items-center justify-center gap-2 text-xs font-bold text-slate-400 uppercase tracking-wider">
            <span class="flex h-2 w-2 relative">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
            </span>
            <span>The page will be available soon. thank you for your patience!</span>
        </div>
    </div>

</body>
</html>
