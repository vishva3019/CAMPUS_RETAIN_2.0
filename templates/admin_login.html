<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff sign-in | Campus Retain</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    {% include "partials/theme.html" %}
    <style>
        .glow-a, .glow-b { position: fixed; border-radius: 9999px; filter: blur(70px); pointer-events: none; }
        .glow-a { width: 30rem; height: 30rem; left: -10rem; top: -12rem; background: rgba(147, 197, 253, .55); }
        .glow-b { width: 26rem; height: 26rem; right: -10rem; bottom: -10rem; background: rgba(165, 243, 252, .45); }
        @media (prefers-reduced-motion: no-preference) {
            .rise { animation: rise .6s cubic-bezier(.22, 1, .36, 1) both; }
            @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        }
    </style>
</head>
<body class="min-h-screen bg-ivory text-stone-900 flex items-center justify-center p-5">
    <div class="glow-a" aria-hidden="true"></div>
    <div class="glow-b" aria-hidden="true"></div>

    <main class="relative w-full max-w-md rise">
        <a href="/" class="flex items-center justify-center gap-2.5 mb-8">
            <img src="/static/favicon.svg" alt="" class="w-10 h-10">
            <span class="font-display text-xl font-extrabold">Campus <span class="text-brand-700">Retain</span></span>
        </a>

        <div class="bg-white border border-stone-200 rounded-3xl shadow-xl shadow-stone-900/[0.04] p-7 sm:p-9">
            <h1 class="text-3xl font-extrabold text-center">Staff sign-in</h1>
            <p class="text-center text-stone-500 mt-2 text-[15px]">For college admins, moderators, security staff and platform admins.</p>

            {% if error %}
            <div role="alert" class="mt-6 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800">{{ error }}</div>
            {% endif %}
            {% if success %}
            <div role="status" class="mt-6 rounded-xl border border-brand-200 bg-brand-50 px-4 py-3 text-sm text-brand-800">{{ success }}</div>
            {% endif %}

            <form action="/admin_login" method="POST" class="mt-7 space-y-5">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div>
                    <label for="email" class="block text-sm font-semibold text-stone-700 mb-1.5">Email</label>
                    <input id="email" type="email" name="email" placeholder="you@yourcollege.edu.in" required autocomplete="username"
                           class="w-full rounded-xl border border-stone-200 bg-white px-3.5 py-3 text-[15px] placeholder:text-stone-400 outline-none transition focus:border-brand-600 focus:ring-4 focus:ring-brand-500/20">
                </div>
                <div>
                    <label for="password" class="block text-sm font-semibold text-stone-700 mb-1.5">Password</label>
                    <input id="password" type="password" name="password" required autocomplete="current-password"
                           class="w-full rounded-xl border border-stone-200 bg-white px-3.5 py-3 text-[15px] outline-none transition focus:border-brand-600 focus:ring-4 focus:ring-brand-500/20">
                </div>
                <button type="submit"
                        class="w-full rounded-xl bg-brand-700 py-3.5 text-[15px] font-semibold text-ivory shadow-lg shadow-brand-900/20 transition hover:bg-brand-800 active:scale-[0.99]">
                    Sign in
                </button>
            </form>
        </div>

        <p class="text-center text-sm text-stone-500 mt-6">
            Student? <a href="/app/signin" class="font-semibold text-brand-700 hover:text-brand-800">Sign in here</a>
        </p>
    </main>
</body>
</html>
